<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">DESAFÍOS</span>
          <div class="multiselect" id="challenges">
            <button type="button" class="multiselect-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Desafíos">
              <span class="multiselect-label">Ninguno</span>
              <span class="caret">▾</span>
            </button>
            <div class="multiselect-menu" role="listbox" aria-multiselectable="true" hidden>
              <button type="button" class="multiselect-option" role="option" aria-selected="false" data-value="garbage">
                <span class="check"></span><span class="name">Basura</span><small>+1 línea cada 30 s</small>
              </button>
              <button type="button" class="multiselect-option" role="option" aria-selected="false" data-value="scattered">
                <span class="check"></span><span class="name">Escombros</span><small>bloques sueltos al iniciar y al subir de nivel</small>
              </button>
            </div>
          </div>
          <span class="challenge-info" id="challenge-info"></span>
        </div>

        <div class="panel-section">
          <span class="label">RÉCORDS</span>
          <div class="records" id="records-panel"></div>
          <button type="button" class="records-reset" id="records-reset">Borrar récords</button>
        </div>

        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-toggle">
            <input type="checkbox" id="theme-toggle" role="switch" aria-label="Modo claro" />
            <span class="slider"></span>
            <span>Modo claro</span>
          </label>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>↑</kbd> comodín: fila/columna</li>
            <li><kbd>⇊</kbd> compacta 5×5 (cada 45 s)</li>
            <li><kbd>✸</kbd> bomba 3×3 (cada 10 líneas)</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="overlay-records" hidden>
          <p id="new-record" class="new-record" hidden></p>
          <form id="name-form" class="name-form" hidden>
            <input type="text" id="name-input" maxlength="12" placeholder="Tu nombre" autocomplete="off" aria-label="Nombre del jugador" />
            <button type="submit">Guardar</button>
          </form>
          <div class="records" id="records-overlay"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
